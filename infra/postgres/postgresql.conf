# PostgreSQL starting configuration for ADAS CRM server (PRD §10.3)
# Target hardware: Intel i3-6100T (2C/4T), 16 GB DDR4, 256 GB SSD

shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
max_connections = 60
random_page_cost = 1.1
wal_compression = on
archive_mode = on
archive_timeout = 300
log_min_duration_statement = 500ms
shared_preload_libraries = 'pg_stat_statements'
