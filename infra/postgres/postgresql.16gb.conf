# =============================================================================
# ADAS CRM — PostgreSQL 17 Configuration for 16 GB RAM Server (PRD §10.3)
# Container limit: 4 GB | OS + Page Cache headroom: ~8 GB
# =============================================================================

listen_addresses = '*'
max_connections = 60

# Memory Tuning (PRD §10.3)
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB

# SSD & Planner Tuning (PRD §10.3)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL & Continuous Archiving (PRD §10.3, §10.5)
wal_compression = on
archive_mode = on
archive_timeout = 300
archive_command = '/bin/true'

# Observability & Slow Query Logging (PRD §10.3)
log_min_duration_statement = 500ms
shared_preload_libraries = 'pg_stat_statements'
timezone = 'UTC'
