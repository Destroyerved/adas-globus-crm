# =============================================================================
# ADAS CRM — Phase 6 n8n External Workflow Orchestrator (PRD §4.14, §10.2, §10.4)
# Usage:
#   docker compose -f infra/compose.dev.yml -f infra/compose.n8n.yml up -d
# Local URL:
#   http://localhost:5678  (Production ingress: https://automation.adasglobuspro.com)
# =============================================================================

name: adas-crm-dev

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.76.1
    container_name: adas-crm-n8n
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      ADAS_API_BASE_URL: http://host.docker.internal:3000/api/v1
      ADAS_WEBHOOK_SECRET: whsec_adas_n8n_dev_secret_2026
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
