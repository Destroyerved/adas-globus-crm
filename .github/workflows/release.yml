name: Release One-Click Deployer (.exe) & 16GB Server Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production packages & compile ADAS-CRM-Deployer.exe
        run: pnpm build

      - name: Package 16GB Server Release Bundle (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-bundle | Out-Null
          Copy-Item dist/deployer/ADAS-CRM-Deployer.exe -Destination release-bundle/ADAS-CRM-Deployer.exe
          Copy-Item README.md -Destination release-bundle/
          Copy-Item .env.example -Destination release-bundle/
          Copy-Item package.json -Destination release-bundle/
          Copy-Item -Recurse infra -Destination release-bundle/infra
          Compress-Archive -Path release-bundle/* -DestinationPath ADAS-CRM-16GB-Server-Bundle.zip -Force

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ADAS CRM ${{ github.ref_name }} — Server Installer & Deployment Bundle"
          body: |
            ## ADAS CRM ${{ github.ref_name }}

            See `docs/PROGRESS.md` and `docs/PRODUCTION_READINESS_REPORT.md` for verified capabilities and external connector requirements.

            ### Attached Release Assets
            1. **`ADAS-CRM-Deployer.exe`** — Windows Server Installer & Provisioning Wizard (`dist/deployer/ADAS-CRM-Deployer.exe`).
            2. **`ADAS-CRM-16GB-Server-Bundle.zip`** — Deployment bundle (`infra/`, `.env.example`, `README.md`, and installer).
          files: |
            dist/deployer/ADAS-CRM-Deployer.exe
            ADAS-CRM-16GB-Server-Bundle.zip
