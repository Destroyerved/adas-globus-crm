name: CI

on:
  push:
    branches:
      - main
      - 'p0/**'
      - 'p1/**'
      - 'p2/**'
      - 'p3/**'
      - 'p4/**'
      - 'p5/**'
      - 'p6/**'
      - 'r*/**'
      - 'm*/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck, Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize PostgreSQL roles and test database
        env:
          PGPASSWORD: ci_postgres_password
        run: psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -f infra/postgres/create-local-dev-db.sql

      - name: Run pnpm check (lint + typecheck + unit + integration on PGlite)
        run: pnpm check

      - name: Run integration suite against real PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgresql://adas_admin:adas_admin_password@127.0.0.1:5432/adas_crm_test
        run: pnpm test:int

      - name: Build workspace packages
        run: pnpm build

  e2e:
    name: Playwright E2E & Accessibility (axe)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace
        run: pnpm build

      - name: Run Playwright E2E suite
        run: pnpm test:e2e
